<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Nail Edit | Booking</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f3f1ee;
      color: #343236;
      font-family: Arial, Helvetica, sans-serif;
      padding: 24px;
    }

    .card {
      width: 100%;
      max-width: 440px;
      background: #faf9f7;
      border: 1px solid #d8d4cf;
      border-radius: 24px;
      padding: 42px 28px;
      text-align: center;
    }

    .eyebrow {
      font-size: 12px;
      letter-spacing: 4px;
      color: #827d78;
      margin-bottom: 18px;
    }

    h1 {
      margin: 0 0 12px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 38px;
      font-weight: 500;
    }

    p {
      margin: 0 0 30px;
      line-height: 1.6;
      color: #6e6965;
      font-size: 15px;
    }

    a {
      display: block;
      width: 100%;
      padding: 17px 20px;
      border-radius: 100px;
      background: #56514d;
      color: white;
      text-decoration: none;
      font-weight: 600;
      letter-spacing: .5px;
    }

    .note {
      margin-top: 18px;
      margin-bottom: 0;
      font-size: 12px;
      color: #918b86;
    }
  </style>
</head>

<body>

  <div class="card">
    <div class="eyebrow">THE NAIL EDIT</div>

    <h1>Book your appointment.</h1>

    <p>
      Nails, lashes, foot spa, and The Nail Edit exclusive services.
      Tap below to continue to our booking page.
    </p>

    <a
      href="https://script.google.com/macros/s/AKfycbzthnoZ1NiUJt4Pd_tS8-2vKF7K9SoKMylXmuE0PU4Vctvoayk1AtnetuPvUexC2NPe/exec"
      target="_blank"
      rel="noopener noreferrer">
      CONTINUE TO BOOKING
    </a>

    <p class="note">
      You will be redirected to The Nail Edit's secure booking page.
    </p>
  </div>

</body>
</html>
